# ttxtv settings - UK Freeview listings from the Freeview-EPG project (personal use)
# Pages folder: ../server/pages when the tv and server folders sit side by side
pagesdir=../server/pages
url=https://raw.githubusercontent.com/dp247/Freeview-EPG/master/epg.xml
# Minutes between downloads (the file is regenerated every 8 hours, about 22 MB)
download=240
# Minutes between rebuilding the pages from the saved copy
refresh=5
indexpage=600
# listings id,name,page - regional ids for the South: BBCOneSouth.uk, ITV1MeridianS.uk,
# Channel4South.uk. Other regions: BBCOneLondonHD.uk, ITV1London.uk, BBCOneWest.uk,
# ITV1West.uk, BBCOneSouthWest.uk, ITV1WestCountry.uk ... (see the README)
channel=BBCOneSouth.uk,BBC ONE,601
channel=BBCTwoHD.uk,BBC TWO,602
channel=ITV1MeridianS.uk,ITV1,603
channel=Channel4South.uk,CHANNEL 4,604
channel=5.uk,CHANNEL 5,605
channel=BBCFourHD.uk,BBC FOUR,606
channel=BBCNews.uk,BBC NEWS,607
channel=ITV2.uk,ITV2,608
channel=E4.uk,E4,609
