# ttxflights settings for FlightAware AeroAPI (Personal tier)
# Your AeroAPI key, from the AeroAPI portal on flightaware.com
apikey=
# Pages folder: ../server/pages when the flights and server folders sit side by side
pagesdir=../server/pages
url=https://aeroapi.flightaware.com/aeroapi/airports/{code}/flights/scheduled_{type}?type=Airline&max_pages={pages}
header=x-apikey: {key}
# Dollars a month to stay within (feeders get $10 free) and the price of one
# result set (15 flights) for these queries - check the AeroAPI portal pricing
monthlybudget=9.50
pageprice=0.02
# Result sets per board (1 = up to 15 flights each). More pages cost more.
maxpages=1
# Seconds between requests (Personal tier: 10 result sets a minute)
gap=7
hours=6-23
indexpage=410
# ICAO airport code, name, arrivals page (departures go on the next page)
airport=EGHI,SOUTHAMPTON,411
airport=EGGD,BRISTOL,413
airport=EGLL,HEATHROW,415
airport=EGKK,GATWICK,417
