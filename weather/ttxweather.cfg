# ttxweather settings - weather data by Open-Meteo.com (free, no key needed)
# Pages folder: ../server/pages when the weather and server folders sit side by side
pagesdir=../server/pages
# Minutes between updates
interval=30
indexpage=400
timezone=Europe/London
# name,latitude,longitude,page   (up to 9 places, pages 401-409)
# Find a place's latitude/longitude by right-clicking it in Google Maps
place=SOUTHAMPTON,50.909,-1.404,401
place=LONDON,51.507,-0.128,402
place=BRISTOL,51.454,-2.588,403
